<title>Iron Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{
  --bg:#f3f3f0; --surface:#ffffff; --surface-2:#ebebe6; --ink:#16181c; --muted:#5f636b; --line:#dcdcd5;
  --accent:#ffc21a; --accent-ink:#16181c; --accent-text:#8a6300; --good:#1f7a4d; --good-bg:#e2f3e8; --bad:#b3261e; --bad-bg:#fdeceb;
  --done:#e9f5ee; --shadow:0 1px 2px rgba(22,24,28,.06),0 6px 18px rgba(22,24,28,.07);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#111316; --surface:#1a1d22; --surface-2:#252a31; --ink:#f1f2f4; --muted:#9aa1ab; --line:#2e343c;
  --accent:#ffc93c; --accent-ink:#16181c; --accent-text:#ffc93c; --good:#5fd39a; --good-bg:#15301f; --bad:#f28b82; --bad-bg:#3b1e1c;
  --done:#16281e; --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#111316; --surface:#1a1d22; --surface-2:#252a31; --ink:#f1f2f4; --muted:#9aa1ab; --line:#2e343c;
  --accent:#ffc93c; --accent-ink:#16181c; --accent-text:#ffc93c; --good:#5fd39a; --good-bg:#15301f; --bad:#f28b82; --bad-bg:#3b1e1c;
  --done:#16281e; --shadow:none;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.45 "Figtree",system-ui,sans-serif;padding-inline:16px;padding-block:0 140px}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3,.cond{font-family:"Barlow Condensed","Figtree",system-ui,sans-serif;letter-spacing:.01em}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:800;text-transform:uppercase}
h2{font-size:24px;font-weight:700}
h3{font-size:19px;font-weight:700}
.num{font-variant-numeric:tabular-nums}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}
.brand svg{width:34px;height:34px;flex:none}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tab{padding:9px 4px;border-radius:10px;font-size:15px}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
button,select{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;font-weight:600}
button:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-size:17px;padding:14px;font-weight:800}
.ghost{background:transparent}
.small{padding:6px 10px;font-size:14px}
.danger{color:var(--bad);border-color:var(--bad)}
.row{display:flex;align-items:center;gap:10px}
.grow{flex:1;min-width:0}
input[type=text],input[type=search],select,textarea{font:inherit;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:90px;resize:vertical;font-size:13px}
.hint{font-size:14px;color:var(--muted);margin:0}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.btnrow>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:7px 12px;border-radius:999px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.err{background:var(--bad-bg);color:var(--bad);padding:10px 12px;border-radius:10px;font-weight:600;font-size:14px}
.ok{background:var(--good-bg);color:var(--good);padding:10px 12px;border-radius:10px;font-weight:700;font-size:14px}

/* day picker */
.days{display:flex;flex-direction:column;gap:10px}
.daycard{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-align:left}
.daycard.next{border:2px solid var(--accent)}
.daycard .dn{font-family:"Barlow Condensed",sans-serif;font-size:24px;font-weight:700}
.daycard .dm{font-size:13px;color:var(--muted);grid-column:1}
.daycard .go{grid-row:1 / 3;grid-column:2;background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:800}
.nextTag{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:2px 8px;border-radius:999px;background:var(--accent);color:var(--accent-ink);margin-left:8px;vertical-align:4px;font-family:"Figtree",sans-serif}

/* session */
.sesshead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:14px;background:var(--ink);color:var(--bg)}
.sesshead .clock{font-family:"Barlow Condensed",sans-serif;font-size:30px;font-weight:700;line-height:1}
.sesshead small{display:block;font-size:12px;opacity:.7;text-transform:uppercase;letter-spacing:.08em}
.exc{display:flex;flex-direction:column;gap:10px}
.exhead{display:flex;align-items:flex-start;gap:10px}
.exhead .en{font-family:"Barlow Condensed",sans-serif;font-size:22px;font-weight:700;line-height:1.1}
.exhead .em{font-size:13px;color:var(--muted)}
.prev{font-size:13px;color:var(--muted)}
.hintup{display:inline-block;font-size:12px;font-weight:800;padding:3px 8px;border-radius:999px;background:var(--good-bg);color:var(--good)}
.sets{display:flex;flex-direction:column;gap:6px}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 52px;gap:8px;align-items:center;padding:4px;border-radius:10px}
.setrow.done{background:var(--done)}
.setrow .sn{font-weight:800;text-align:center;color:var(--muted)}
.setrow input{text-align:center;font-size:19px;font-weight:700;padding:9px 4px}
.setrow .ck{height:46px;padding:0;font-size:22px;font-weight:800}
.setrow.done .ck{background:var(--good);border-color:var(--good);color:#fff}
.setlbl{display:grid;grid-template-columns:28px 1fr 1fr 52px;gap:8px;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;text-align:center;padding:0 4px}
.setmeta{grid-column:2 / 5;font-size:12px;color:var(--muted);margin-top:-4px;padding-left:2px}
.setmeta b{color:var(--good)}

.tagbtn{background:transparent;border:0;padding:0;height:36px;font-weight:800;color:var(--muted);font-size:15px}
.tagbtn.tg-W{color:#2f6fd6} .tagbtn.tg-D{color:#b8610e} .tagbtn.tg-F{color:var(--bad)}
.rir{display:inline-flex;align-items:center;gap:3px;margin-left:8px;flex-wrap:wrap}
.rir .rl{font-weight:800;font-size:11px;letter-spacing:.05em;margin-right:2px}
.rir button{padding:2px 8px;font-size:12px;border-radius:999px;font-weight:700}
.rir button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.setmeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px}
.more summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--accent-text)}
.more .tip{font-size:14px;margin:8px 0 0;max-width:62ch}
.more textarea{min-height:56px;font-size:14px;margin-top:4px}
.lbl2{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-top:10px}
.notepre{font-size:13.5px;font-style:italic;color:var(--muted)}
.exc.ss{border-left:5px solid var(--accent)}
.exc.ss-a{border-bottom-left-radius:4px;border-bottom-right-radius:4px;margin-bottom:-10px}
.exc.ss-b{border-top-left-radius:4px;border-top-right-radius:4px}
.sslabel{font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--accent-text)}
.swapopt{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;padding:12px 14px}
.swapopt .n{font-weight:800}
.swapopt .m{font-size:13px;color:var(--muted);grid-column:1}
.swapopt .why{grid-row:1 / 3;grid-column:2;font-size:12px;font-weight:700;color:var(--good);align-self:center;text-align:right}
.playbook li{font-size:14.5px;line-height:1.55;margin-bottom:6px}
.target{position:relative}
.hbar .t{position:relative}
.hbar .t span.band{position:absolute;top:0;bottom:0;height:auto;background:var(--good-bg);border-radius:0;outline:1px dashed var(--good);outline-offset:-1px}
.hbar .t span.fill{position:relative}
/* timer */
.timer{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--ink);color:var(--bg);padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));box-shadow:0 -8px 24px rgba(0,0,0,.25)}
.timer .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:auto 1fr auto;gap:6px 12px;align-items:center}
.timer .big{font-family:"Barlow Condensed",sans-serif;font-size:44px;font-weight:800;line-height:1;min-width:92px}
.timer .lbl{font-size:13px;opacity:.8}
.timer .bar{grid-column:1 / 4;height:6px;border-radius:3px;background:rgba(255,255,255,.15);overflow:hidden}
.timer .bar span{display:block;height:100%;background:var(--accent)}
.timer .tb{display:flex;gap:6px}
.timer .tb button{background:transparent;color:var(--bg);border-color:rgba(255,255,255,.3);padding:8px 10px;font-size:14px}
.timer.over{background:var(--good)}
.timer.over .bar span{background:#fff}

/* program editor */
.pitem{display:flex;flex-direction:column;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.pitem:last-child{border-bottom:0}
.pitem .pn{font-weight:800}
.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pgrid label{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700;display:flex;flex-direction:column;gap:4px}
.mini{display:flex;align-items:center;gap:2px}
.mini button{width:34px;height:36px;padding:0;font-size:18px}
.mini span{min-width:36px;text-align:center;font-weight:800;font-size:16px}
.reps{display:flex;align-items:center;gap:4px}
.reps input{text-align:center;padding:8px 2px;font-weight:700;font-size:16px;width:100%;min-width:0}
.iconbtns{display:flex;gap:4px;margin-left:auto}
.iconbtns button{padding:4px 9px;font-size:14px}

/* picker */
.modal{position:fixed;inset:0;z-index:30;background:var(--bg);display:flex;flex-direction:column}
.modal .mh{padding:calc(12px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line);max-width:620px;width:100%;margin:0 auto}
.modal .mb{flex:1;overflow-y:auto;padding:0 16px}
.modal .mb .inner{max-width:620px;margin:0 auto}
.modal .mf{padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);max-width:620px;width:100%;margin:0 auto}
.scrollchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.scrollchips .chip{white-space:nowrap;flex:none}
.exrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--line);width:100%;text-align:left;background:transparent;border-radius:0;border-left:0;border-right:0;border-top:0}
.exrow .n{font-weight:700}
.exrow .m{font-size:13px;color:var(--muted)}
.exrow .box{grid-row:1 / 3;grid-column:2;width:30px;height:30px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:800}
.exrow[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

/* history & progress */
.sess{display:flex;flex-direction:column;gap:4px;padding-block:12px;border-top:1px solid var(--line)}
.sess:first-child{border-top:0;padding-top:0}
.sess .sh{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.sess .sh b{font-family:"Barlow Condensed",sans-serif;font-size:20px}
.sess .sm{font-size:13px;color:var(--muted)}
.sess details summary{cursor:pointer;font-size:14px;font-weight:700;color:var(--accent-text)}
.sess .ex{font-size:14px;padding:4px 0}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{padding:14px;border-radius:12px;background:var(--surface);border:1px solid var(--line)}
.tile .v{font-family:"Barlow Condensed",sans-serif;font-size:34px;font-weight:800;line-height:1}
.tile .l{font-size:13px;color:var(--muted)}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:12px "Figtree",sans-serif}
.chart .bar{fill:var(--accent)}
.chart .bar:hover{opacity:.8}
.chart .grid{stroke:var(--line);stroke-width:1}
.hbar{display:grid;grid-template-columns:96px 1fr 36px;gap:8px;align-items:center;font-size:14px}
.hbar .t{height:12px;border-radius:0 4px 4px 0;background:var(--surface-2);overflow:hidden}
.hbar .t span{display:block;height:100%;background:var(--accent);border-radius:0 4px 4px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal span{height:22px;border-radius:4px;background:var(--surface-2)}
.cal span.on{background:var(--accent)}
.cal span.today{outline:2px solid var(--ink);outline-offset:-2px}
.tablewrap{overflow-x:auto}
table.st{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums;font-size:14px}
table.st th,table.st td{padding:7px 6px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
table.st th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
table.st th:first-child,table.st td:first-child{text-align:left;white-space:normal}
.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:40;background:var(--good);color:#fff;font-weight:800;padding:12px 18px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.3);max-width:calc(100% - 32px);text-align:center}
.summary{background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:8px}
.summary .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}
.summary .stats b{display:block;font-family:"Barlow Condensed",sans-serif;font-size:30px;line-height:1}
.summary button{background:var(--accent-ink);color:var(--accent);border-color:var(--accent-ink)}

/* goals, blocks & targets */
.pbar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden}
.pbar span{display:block;height:100%;background:var(--accent)}
.panel.due{border:2px solid var(--accent)}
.gfield{display:flex;flex-direction:column;gap:8px}
.gl{font-weight:700;font-size:15px}
.tg{display:inline-block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.05em;padding:2px 7px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tg.up{background:var(--good-bg);color:var(--good)}
.tg.down{background:var(--bad-bg);color:var(--bad)}
.rvx{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line)}
.rvx:last-child{border-bottom:0}
.rvx .n{font-weight:800}
.why{font-size:13px;color:var(--muted);margin:0;line-height:1.4}
.tgt{display:flex;flex-direction:column;gap:2px;font-size:13px;padding:8px 10px;border-radius:10px;background:var(--surface-2);color:var(--muted)}
.tgt b{font-size:15px;color:var(--ink)}
.tgt.up{background:var(--good-bg);color:var(--good)}
.tgt.up b{color:var(--good)}
.tgt.down{background:var(--bad-bg);color:var(--bad)}
.tgt.down b{color:var(--bad)}
.summary .sumbtns{display:flex;flex-direction:column;gap:8px}

function bestE1(exId, excludeActive){

}
function volumeOf(sess){ let v = 0; sess.items.forEach(it => { if (exById(it.ex).t === "time") return; it.sets.forEach(s => { if (s.done && s.tag !== "W"){ const w = num(s.w), r = num(s.r); if (w && r) v += w*r; } }); }); return Math.round(v); }
function setsOf(sess){ return sess.items.reduce((a,it)=>a+it.sets.filter(s=>s.done && s.tag !== "W").length,0); }
function fmtSet(s, t){ const tg = s.tag ? `${s.tag} ` : ""; const rr = s.rir != null ? ` @${s.rir>=4?"4+":s.rir}` : ""; if (t === "time") return tg + fmtTime(parseTime(s.r)||0); const w = num(s.w); return `${tg}${w ? w : "BW"}×${s.r||0}${rr}`; }
function overloadHint(item){
  const ex = exById(item.ex), last = lastPerf(item.ex);
  if (!last || ex.t === "time" || !item.hi) return "";
  const work = last.work.filter(s => s.tag !== "D");
  if (!work.length) return "";
  const hitTop = work.length >= (item.targetSets||1) && work.every(s => (num(s.r)||0) >= item.hi);
  const easy = work.filter(s => s.rir != null);
  if (hitTop) return `↑ Hit ${item.hi} reps on every set last time. Try +${U()==="kg"?"2.5":"5"} ${U()}.`;
  if (easy.length && easy.every(s => s.rir >= 4)) return `Last time every set was 4+ reps from failure. Push closer: aim for 1–3 in reserve.`;
  return "";
}

// ---------- blocks: where you are in the current plan ----------
const avg = a => a.length ? a.reduce((x,y)=>x+y,0) / a.length : 0;
const weekOf = t => startOfDay(t) - ((new Date(t).getDay()+6)%7)*dayMs;
const fmtW = w => `${+(+w).toFixed(1)} ${U()}`;
const pct = c => `${c >= 0 ? "+" : "−"}${Math.abs(Math.round(c*100))}%`;
function blockSessions(b){ return state.sessions.filter(s => s.end >= b.start && (!b.end || s.end < b.end)); }
// A week counts once you've trained in it. The block is done after that many weeks, or as soon as you finish
// every day of its last week.
function blockInfo(){
  const b = state.block, S = blockSessions(b), per = Math.max(1, state.days.length);
  const now = weekOf(Date.now()), wks = [...new Set(S.map(s => weekOf(s.end)))];
  const thisWeek = S.filter(s => weekOf(s.end) === now).length;
  const done = wks.filter(w => w < now).length + (thisWeek >= per ? 1 : 0);
  const week = Math.max(1, wks.includes(now) ? wks.length : wks.length + 1);
  return { b, S, per, done, week, intro:!!b.intro && week === 1, due:state.days.length > 0 && done >= b.weeks };
}
// How hard working sets should be, as reps in reserve: easy in the learning week, hardest in the last week
function effortFor(week, weeks, intro){ if (intro && week === 1) return [3,4]; if (week >= weeks) return [0,1]; if (week <= (intro ? 3 : 2)) return [2,3]; return [1,2]; }
function sessionCtx(dayId){ const I = blockInfo(); return { dayId, week:I.week, weeks:I.b.weeks, intro:I.intro, rir:effortFor(I.week, I.b.weeks, I.b.intro) }; }

// One number per workout for an exercise, to compare sessions: estimated 1RM, best reps (bodyweight) or longest hold
function perfScore(work, ex){
  if (ex.t === "time") return Math.max(0, ...work.map(s => parseTime(s.r) || 0));
  const use = work.some(s => s.tag !== "D") ? work.filter(s => s.tag !== "D") : work;
  if (!use.some(s => num(s.w))) return Math.max(0, ...use.map(s => num(s.r) || 0));
  return Math.max(0, ...use.map(s => { const w = num(s.w), r = Math.min(num(s.r) || 0, 20); return w && r ? w * (1 + r/30) : 0; }));
}
function bestSet(work, ex){ let b = null, bs = -1; work.forEach(s => { const v = perfScore([s], ex); if (v > bs){ bs = v; b = s; } }); return b ? fmtSet({ w:b.w, r:b.r }, ex.t) : ""; }
const trendOf = c => c == null ? "new" : c >= .05 ? "up" : c >= .015 ? "steady" : c > -.02 ? "flat" : "down";
function exposures(exId){
  const ex = exById(exId), out = [];
  state.sessions.forEach(s => { const it = s.items.find(x => x.ex === exId); if (!it) return; const work = it.sets.filter(x => x.done && x.tag !== "W"); if (work.length) out.push({ at:s.end, dayId:s.dayId, work, score:perfScore(work, ex) }); });
  return out;
}
// What happened in a block: each exercise's change from its first to its last sessions, and each muscle's sets and trend
function analyzeBlock(b){
  b = b || state.block;
  const S = blockSessions(b), ex = {}, rirs = [];
  S.forEach(s => s.items.forEach(it => {
    const e = exById(it.ex), work = it.sets.filter(x => x.done && x.tag !== "W"); if (!work.length) return;
    work.forEach(x => { if (x.rir != null) rirs.push(x.rir); });
    const r = ex[it.ex] || (ex[it.ex] = { id:it.ex, m:e.m, t:e.t, list:[], sets:0 });
    r.list.push({ at:s.end, score:perfScore(work, e), best:bestSet(work, e) }); r.sets += work.length;
  }));
  const list = Object.values(ex).map(r => {
    const L = r.list, n = L.length, k = Math.max(1, Math.min(2, Math.floor(n/2)));
    const first = avg(L.slice(0,k).map(x => x.score)), last = avg(L.slice(-k).map(x => x.score));
    const ch = n >= 2 && first > 0 ? (last - first) / first : null;
    const stuck = n >= 4 && Math.max(...L.slice(-3).map(x => x.score)) <= Math.max(...L.slice(0,-3).map(x => x.score)) * 1.005;
    return { ...r, n, ch, stuck, trend:trendOf(ch), from:L[0].best, to:L[n-1].best };
  });
  const weeks = Math.max(1, new Set(S.map(s => weekOf(s.end))).size), mus = {};
  list.forEach(r => { if (!LIFT_MUSCLES.includes(r.m)) return; const M = mus[r.m] || (mus[r.m] = { m:r.m, sets:0, cw:0, w:0 }); M.sets += r.sets; if (r.ch != null){ M.cw += r.ch * r.sets; M.w += r.sets; } });
  Object.values(mus).forEach(M => { M.ch = M.w ? M.cw / M.w : null; M.trend = trendOf(M.ch); M.perWeek = M.sets / weeks; });
  const calWeeks = Math.max(1, Math.ceil(((b.end || Date.now()) - b.start) / (7*dayMs)));
  return { S, weeks, ex:list, mus, rir:rirs.length ? avg(rirs) : null, adherence:Math.min(1, S.filter(s => s.dayId).length / (calWeeks * Math.max(1, state.days.length))) };
}

// ---------- targets: what to lift today ----------
function stepFor(ex, w){ const kg = U() === "kg"; if (ex.e === "DB") return kg ? 2 : 5; if (ex.e === "KB") return kg ? 4 : 5; if (LOWER.has(ex.m) && ["BB","TB","SM","MA","PL"].includes(ex.e) && w >= (kg ? 40 : 90)) return kg ? 5 : 10; return kg ? 2.5 : 5; }
const granFor = ex => U() === "kg" ? (ex.e === "KB" ? 4 : ex.e === "DB" ? 2 : 2.5) : 5;   // smallest change you can actually load
const roundTo = (w, st) => Math.max(st, Math.round(w / st) * st);
// Double progression: add reps until every set reaches the top of the range, then add weight (upper body about
// 5 lb, lower body about 10 lb, as the NSCA suggests) and work back up. The reference is the same day last week
// when there is one, otherwise the latest session. Two sessions down in a row or three without a new best slows it.
function targetFor(tpl, ctx){
  const ex = exById(tpl.ex), n = Math.max(1, tpl.sets || 3), lo = tpl.lo || 8, hi = Math.max(lo, tpl.hi || 12), rir = ctx.rir;
  const fill = (w, r, kind, why) => ({ kind, why, w, reps:Array.from({length:n}, (_,k) => Array.isArray(r) ? (r[k] != null ? r[k] : r[r.length-1]) : r) });
  const H = exposures(tpl.ex);
  if (!H.length) return fill("", "", "new", ctx.intro ? `New exercise. Find a weight you could lift about ${hi+3} times and stop at ${lo}–${hi}, with 3–4 reps left.` : `First time. Pick a weight you can lift ${lo}–${hi} times with 1–3 reps left.`);
  const latest = H[H.length-1], ref = [...H].reverse().find(h => h.dayId && h.dayId === ctx.dayId && Date.now() - h.at < 21*dayMs) || latest;
  const ago = ref === latest ? "last time" : "last week";
  const sc = H.slice(-3).map(h => h.score);
  const slipping = sc.length === 3 && sc[2] < sc[1] * .99 && sc[1] < sc[0] * .99;
  const stalled = H.length >= 4 && Math.max(...sc) <= Math.max(...H.slice(0,-3).map(h => h.score)) * 1.005;
  const work = ref.work.some(s => s.tag !== "D") ? ref.work.filter(s => s.tag !== "D") : ref.work;
  const away = Math.round((Date.now() - latest.at) / (7*dayMs));
  if (ex.t === "time"){
    const T = Math.max(...work.map(s => parseTime(s.r) || 0)), w = (work.find(s => s.w) || {}).w || "";
    if (ctx.intro) return fill(w, fmtTime(Math.max(lo, Math.round(T * .8 / 5) * 5)), "deload", "Learning week: hold about 80% of last time.");
    if (T >= hi) return fill(w, fmtTime(T + 5), "up", `You held ${fmtTime(T)} ${ago}, past your ${hi}-second goal. Add 5 seconds, or add weight or a harder version.`);
    return fill(w, fmtTime(Math.min(hi, T + 5)), "same", `Beat ${ago} by 5 seconds.`);
  }
  const W = Math.max(0, ...work.map(s => num(s.w) || 0));
  const top = W ? work.filter(s => (num(s.w) || 0) === W) : work, topR = top.map(s => num(s.r) || 0);
  const known = top.filter(s => s.rir != null), avgRir = known.length ? avg(known.map(s => s.rir)) : null;
  if (!W){
    if (ctx.intro) return fill("", Math.max(1, Math.min(...topR) - 2), "deload", "Learning week: a couple of reps short of last time.");
    if (topR.every(r => r >= hi)) return fill("", hi, "up", `You hit ${hi}+ on every set ${ago}. Add weight (a belt or dumbbell), slow the lowering to 3 seconds, or try a harder version.`);
    return fill("", topR.map(r => Math.min(hi, r + 1)), "same", `Beat ${ago} by a rep on each set.`);
  }
  const st = stepFor(ex, W), gr = granFor(ex);
  const rtf = Math.max(...top.map(s => (num(s.r) || 0) + (s.rir != null ? Math.min(s.rir, 4) : 1))), e1 = W * (1 + rtf/30);
  const repsAt = w => Math.floor(30 * (e1 / w - 1)) - rir[1];   // reps at weight w, leaving this week's reserve
  if (ctx.intro){ const w = roundTo(W * .9, gr); return fill(w, Math.max(lo, Math.min(hi, repsAt(w))), "deload", `Learning week: about 90% of ${ago} (${fmtW(W)}). Stop 3–4 reps short of failure.`); }
  if (away >= 6){ const w = roundTo(W * .9, gr); return fill(w, lo, "down", `It's been ${away} weeks since you did this. Start around 90% of last time and build back up.`); }
  if (topR.every(r => r >= hi)){
    for (let j = topR.every(r => r >= hi + 2) ? 2 : 1; j >= 1; j--){ const w = roundTo(W + st*j, gr), r = Math.min(hi, repsAt(w)); if (w > W && r >= lo) return fill(w, r, "up", `Up ${fmtW(w - W)}: you hit ${hi}+ reps on every set ${ago}. Aim for ${r} or more.`); }
    return fill(W, hi + 1, "same", `The next jump (+${fmtW(st)}) is big from ${fmtW(W)}. Stay here and push past ${hi} reps first.`);
  }
  if (topR[0] < lo){
    const prev = H.length >= 2 ? H[H.length-2] : null, prevLow = prev && prev.work.some(s => (num(s.w) || 0) >= W && (num(s.r) || 0) < lo);
    if (prevLow || slipping){ const w = roundTo(W - st, gr); return fill(w, lo, "down", `Down to ${fmtW(w)}: you've been under ${lo} reps. Land in your ${lo}–${hi} range, then build back up.`); }
    return fill(W, lo, "same", `Same weight. Aim for at least ${lo} reps on every set.`);
  }
  if (stalled){ const w = roundTo(W * .9, gr); return fill(w, Math.min(hi, Math.max(lo, repsAt(w))), "down", `No new best in 3 sessions. Take about 10% off, beat your reps, and build back up.`); }
  if (slipping) return fill(W, topR, "same", `Down two sessions in a row, so fatigue may be building. Same weight: just match ${ago}.`);
  const add = avgRir != null && avgRir >= 3 ? 2 : 1;
  return fill(W, topR.map(r => Math.min(hi, r + add)), "same", add === 2 ? `Same weight, 2 more reps: you had 3+ reps left ${ago}.` : `Same weight, one more rep than ${ago}.`);
}
function hitTarget(it){
  const t = it.target, ex = exById(it.ex), work = it.sets.filter(x => x.done && x.tag !== "W");
  if (!t || t.kind === "new" || work.length < t.reps.length) return false;
  if (ex.t === "time") return t.reps.every((r, k) => (parseTime(work[k].r) || 0) >= (parseTime(r) || 0));
  return t.reps.every((r, k) => (num(work[k].r) || 0) >= (+r || 0) && (t.w === "" || (num(work[k].w) || 0) >= +t.w));
}

// ---------- timer ----------
let audioCtx = null;
function unlockAudio(){ try{ if (!audioCtx){ audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } if (audioCtx.state === "suspended") audioCtx.resume(); }catch(e){} }
function beep(){
  try{ if (!audioCtx) return; const t0 = audioCtx.currentTime;
    [0, .25, .5].forEach((d,k) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.frequency.value = k === 2 ? 1320 : 880; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(.0001, t0+d); g.gain.exponentialRampToValueAtTime(.4, t0+d+.02); g.gain.exponentialRampToValueAtTime(.0001, t0+d+.18); o.start(t0+d); o.stop(t0+d+.2); });
  }catch(e){}
  try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){}
}
function startTimer(sec, label){ state.timer = { end: Date.now() + sec*1000, total: sec, label, rang:false }; save(); }
setInterval(() => {
  const tm = state.timer; if (!tm) return;
  const left = (tm.end - Date.now())/1000;
  if (left <= 0 && !tm.rang){ tm.rang = true; tm.overAt = Date.now(); save(); beep(); render(); return; }
  if (tm.rang && Date.now() - tm.overAt > 8000){ state.timer = null; save(); render(); return; }
  const b = document.getElementById("tmrBig"); if (b) b.textContent = left > 0 ? fmtTime(left) : "GO";
  const bar = document.getElementById("tmrBar"); if (bar) bar.style.width = `${Math.max(0, Math.min(100, (1 - left/tm.total) * 100))}%`;
  const ck = document.getElementById("sessClock"); if (ck && state.active) ck.textContent = fmtTime((Date.now() - state.active.start)/1000);
}, 250);
setInterval(() => { const ck = document.getElementById("sessClock"); if (ck && state.active && !state.timer) ck.textContent = fmtTime((Date.now() - state.active.start)/1000); }, 1000);

let wakeLock = null;
async function keepAwake(){ try{ if (state.active && "wakeLock" in navigator && document.visibilityState === "visible" && !wakeLock){ wakeLock = await navigator.wakeLock.request("screen"); wakeLock.addEventListener("release", ()=>{ wakeLock = null; }); } }catch(e){ wakeLock = null; } }
document.addEventListener("visibilitychange", () => { keepAwake(); if (document.visibilityState === "visible") render(); });

// ---------- views ----------
function render(){
  const app = document.getElementById("app");
  const ae = document.activeElement, focusId = ae && ae.id, sel = ae && ae.selectionStart;
  const y = window.scrollY;
  const tabs = [["train","Train"],["program","Program"],["history","History"],["progress","Progress"]];
  app.innerHTML = `<div class="top"><div class="brand">${LOGO}<h1 class="grow">Iron Log</h1>${state.active&&state.tab!=="train"?`<button class="small" data-act="tab" data-v="train" id="backToSess" style="background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:800">● In workout</button>`:""}</div>
    <div class="tabs" role="tablist">${tabs.map(([k,l])=>`<button class="tab" role="tab" id="tab-${k}" data-act="tab" data-v="${k}" aria-selected="${state.tab===k}">${l}</button>`).join("")}</div></div>` +
    (!saveOK ? `<div class="err">This browser isn't letting the app save right now (private browsing?). Your workout will be lost if you close it.</div>` : "") +
    (state.tab === "train" ? trainView() : state.tab === "program" ? programView() : state.tab === "history" ? historyView() : progressView()) +
    timerView() + (picker ? pickerView() : "") + (swap && !picker ? swapView() : "") + (toast ? `<div class="toast" role="status">${toast}</div>` : "");
  if (focusId){ const el = document.getElementById(focusId); if (el && !picker || (el && picker && el.closest(".modal"))){ el.focus({preventScroll:true}); try{ if (sel != null) el.setSelectionRange(sel, sel); }catch(_){} } }
  if (!picker && !swap) window.scrollTo(0, y);
}

function timerView(){
  const tm = state.timer; if (!tm) return "";
  const left = (tm.end - Date.now())/1000, over = left <= 0;
  return `<div class="timer ${over?"over":""}" role="timer" aria-live="off"><div class="in">
    <span class="big num" id="tmrBig">${over?"GO":fmtTime(left)}</span>
    <span><span class="lbl">${over?"Rest's up. Next set!":"Resting"}</span><br><b>${esc(tm.label||"")}</b></span>
    <span class="tb">${over?`<button data-act="tmrClose" id="tmrClose">Close</button>`:`<button data-act="tmrAdd" data-v="-15" id="tmrMinus">−15</button><button data-act="tmrAdd" data-v="15" id="tmrPlus">+15</button><button data-act="tmrClose" id="tmrSkip">Skip</button>`}</span>
    <div class="bar"><span id="tmrBar" style="width:${Math.max(0,Math.min(100,(1-left/tm.total)*100))}%"></span></div></div></div>`;
}

function upNextIdx(){
  if (!state.days.length) return -1;
  const last = [...state.sessions].reverse().find(s => state.days.some(d => d.id === s.dayId));
  if (!last) return 0;
  const i = state.days.findIndex(d => d.id === last.dayId);
  return (i + 1) % state.days.length;
}

function trainView(){
  if (summary) return summaryView();
  if (state.active) return sessionView();
  if (review) return reviewView();
  if (!state.days.length){
    return `<div class="panel"><h2>Let's build your program</h2><p class="hint">Set up 3 to 5 workout days. Start from a template, or build your own from about 290 exercises.</p>
      <button class="primary" data-act="tab" data-v="program" id="goProgram">Set up my workout days</button></div>` + quickStart();
  }
  const nx = upNextIdx();
  const cards = state.days.map((d,i) => {
    const last = [...state.sessions].reverse().find(s => s.dayId === d.id);
    const muscles = [...new Set(d.items.map(it => exById(it.ex).m))].slice(0,4).join(", ");
    return `<div class="daycard ${i===nx?"next":""}"><span class="dn">${esc(d.name)}${i===nx?`<span class="nextTag">Up next</span>`:""}</span>
      <span class="dm">${plural(d.items.length,"exercise")}${muscles?` · ${esc(muscles)}`:""} · ${last?`last done ${agoTxt(last.end)}`:"not done yet"}</span>
      <button class="go" data-act="startDay" data-i="${i}" id="start-${i}" ${d.items.length?"":"disabled"}>Start</button></div>`;
  }).join("");
  const wk = state.sessions.filter(s => s.end > Date.now() - 7*dayMs).length;
  return blockCard() + `<div class="panel"><div class="row"><h2 class="grow">Which day is it?</h2><span class="hint num">${plural(wk,"workout")} this week</span></div><div class="days">${cards}</div></div>` + quickStart();
}
function quickStart(){ return `<button class="ghost" data-act="startEmpty" id="startEmpty">Start an empty workout</button>`; }

// Where you are in the block, and the prompt to refresh when it's done (or early, if most lifts have stalled)
function blockCard(){
  const I = blockInfo(), b = I.b;
  if (I.due || I.done >= 4){
    const A = analyzeBlock(), tr = A.ex.filter(r => r.n >= 2 && LIFT_MUSCLES.includes(r.m));
    const up = tr.filter(r => (r.trend === "up" || r.trend === "steady") && !r.stuck).length, deep = A.ex.filter(r => r.n >= 4), stuck = deep.filter(r => r.stuck).length;
    if (I.due){
      const more = tr.length >= 3 && up / tr.length >= .6 && b.weeks < (state.goals.exp === "new" ? 12 : 8);
      return `<div class="panel due"><span class="eyebrow">Block ${b.n} done · ${plural(I.done, "week")} · ${plural(I.S.length, "workout")}</span><h2>Time to refresh your plan 🔄</h2>
        <p class="hint">See what got stronger and what stalled. Then the app builds your next block with new exercises picked for your goals, with a lighter first week to learn them.</p>
        ${more ? `<p class="ok">${up} of ${tr.length} lifts are still climbing. Running 1–2 more weeks is fine too.</p>` : ""}
        <button class="primary" data-act="openReview" id="openReview">Review my block</button>
        <button class="ghost small" data-act="bMore" id="bMore">Keep this plan 1 more week</button></div>`;
    }
    if (!b.ext && deep.length >= 3 && stuck / deep.length >= .5)
      return `<div class="panel due"><span class="eyebrow">Block ${b.n} · week ${I.week} of ${b.weeks}</span><h3>Most of your lifts have stalled</h3>
        <p class="hint">${stuck} of ${deep.length} lifts haven't beaten their best in their last 3 sessions. Refreshing early is a good idea.</p>
        <div class="btnrow"><button data-act="openReview" id="openReviewEarly">Review my block now</button></div></div>`;
  }
  const rir = effortFor(I.week, b.weeks, b.intro), left = Math.max(1, b.weeks - I.done);
  return `<div class="panel" style="gap:8px"><div class="row"><b class="grow">Block ${b.n} · Week ${Math.min(I.week, b.weeks)} of ${b.weeks}</b><span class="hint num">${left === 1 ? "last week" : `refresh in ${left} weeks`}</span></div>
    <div class="pbar"><span style="width:${Math.min(100, I.done / b.weeks * 100)}%"></span></div>
    <span class="hint">${I.intro ? "Learning week, which doubles as a deload: one set fewer per exercise. Stop 3–4 reps short of failure and find your weights." : I.week >= b.weeks ? "Last week of the block: take your working sets to 0–1 reps short of failure." : `This week: stop working sets ${rir[0]}–${rir[1]} reps short of failure.`}</span></div>`;
}

function sessionView(){
  const a = state.active;
  const items = a.items.map((it, xi) => {
    const ex = exById(it.ex), last = lastPerf(it.ex), isT = ex.t === "time";
    const hint = it.target ? "" : overloadHint(it);
    const ssPrev = xi > 0 && a.items[xi-1].ss, inSS = it.ss || ssPrev;
    const rows = it.sets.map((s, si) => `<div class="setrow ${s.done?"done":""}">
        <button class="sn num tagbtn ${s.tag?"tg-"+s.tag:""}" data-act="tag" data-x="${xi}" data-s="${si}" id="tag-${xi}-${si}" aria-label="Set ${si+1} type: ${s.tag?TAGS[s.tag]:"working set"}. Tap to change">${s.tag||si+1}</button>
        ${isT ? `<input type="text" inputmode="numeric" id="w-${xi}-${si}" data-f="w" data-x="${xi}" data-s="${si}" value="${esc(s.w)}" placeholder="${U()} (opt.)" autocomplete="off" aria-label="Set ${si+1} added weight">
                 <input type="text" inputmode="numeric" id="r-${xi}-${si}" data-f="r" data-x="${xi}" data-s="${si}" value="${esc(s.r)}" placeholder="m:ss" autocomplete="off" aria-label="Set ${si+1} time">`
               : `<input type="text" inputmode="decimal" id="w-${xi}-${si}" data-f="w" data-x="${xi}" data-s="${si}" value="${esc(s.w)}" placeholder="${ex.e==="BW"?"BW":U()}" autocomplete="off" aria-label="Set ${si+1} weight">
                 <input type="text" inputmode="numeric" id="r-${xi}-${si}" data-f="r" data-x="${xi}" data-s="${si}" value="${esc(s.r)}" placeholder="${it.lo&&it.hi?`${it.lo}-${it.hi}`:"reps"}" autocomplete="off" aria-label="Set ${si+1} reps">`}
        <button class="ck" data-act="done" data-x="${xi}" data-s="${si}" id="ck-${xi}-${si}" aria-pressed="${s.done}" aria-label="Set ${si+1} done">✓</button>

          ${s.tag!=="W"&&!isT?`<span class="rir" role="group" aria-label="Reps in reserve"><span class="rl">RIR</span>${[0,1,2,3,4].map(v=>`<button data-act="rir" data-x="${xi}" data-s="${si}" data-v="${v}" id="rir-${xi}-${si}-${v}" aria-pressed="${s.rir===v}">${v===4?"4+":v}</button>`).join("")}</span>`:""}</span>` : ""}
      </div>`).join("");
    const note = (state.notes||{})[it.ex] || "";
    return `<div class="panel exc ${inSS?"ss":""} ${it.ss?"ss-a":""} ${ssPrev?"ss-b":""}">
      ${inSS?`<span class="sslabel">${it.ss?"Superset · then":"Superset · after"} ${esc(exById((it.ss?a.items[xi+1]:a.items[xi-1]).ex).n)}</span>`:""}
      <div class="exhead"><div class="grow"><div class="en">${esc(ex.n)}</div><div class="em">${esc(ex.m)} · ${EQ[ex.e]||""} · ${it.targetSets?`${it.targetSets} × ${isT?`${it.lo}-${it.hi}s`:`${it.lo}-${it.hi}`}`:"no target"} · rest ${fmtTime(it.rest)}</div></div>
        <div class="iconbtns"><button id="swap-${xi}" data-act="swap" data-x="${xi}" aria-label="Swap exercise">⇄ Swap</button><button id="up-${xi}" data-act="sxUp" data-x="${xi}" aria-label="Move up" ${xi===0?"disabled":""}>↑</button><button id="rm-${xi}" data-act="sxRm" data-x="${xi}" aria-label="Remove exercise">${confirmKey==="sxrm"+xi?"Remove?":"✕"}</button></div></div>
      ${note ? `<div class="notepre">📝 ${esc(note)}</div>` : ""}
      ${last ? `<div class="prev num">Last time (${agoTxt(last.at)}): ${last.sets.map(s=>fmtSet(s, ex.t)).join(", ")}</div>` : `<div class="prev">First time logging this one.</div>`}
      ${it.target ? targetLine(it, ex) : hint ? `<span class="hintup">${hint}</span>` : ""}
      <div class="setlbl"><span>Set</span><span>${isT?"+Weight":"Weight"}</span><span>${isT?"Time":"Reps"}</span><span></span></div>
      <div class="sets">${rows}</div>
      <div class="btnrow"><button class="small" data-act="addSet" data-x="${xi}" id="addset-${xi}">+ Add set</button><button class="small ghost" data-act="rmSet" data-x="${xi}" id="rmset-${xi}" ${it.sets.length<=1?"disabled":""}>Remove last set</button>
        <button class="small ghost" data-act="restTap" data-x="${xi}" id="rest-${xi}">⏱ Rest ${fmtTime(it.rest)}</button></div>
      <details class="more"><summary>Form tip, notes &amp; options</summary>
        <p class="tip">💡 ${esc(formTip(ex))}</p>

        <textarea id="note-${xi}" data-note="${esc(it.ex)}" placeholder="Seat height, grip, cues…" maxlength="300">${esc(note)}</textarea>
        ${xi < a.items.length-1 ? `<button class="small" data-act="sxSS" data-x="${xi}" id="ss-${xi}">${it.ss?"🔗 Unlink superset":`🔗 Superset with ${esc(exById(a.items[xi+1].ex).n)}`}</button>` : ""}

  }).join("");
  const done = a.items.reduce((n,it)=>n+it.sets.filter(s=>s.done).length,0), total = a.items.reduce((n,it)=>n+it.sets.length,0);
  const w = a.wk;
  return `<div class="sesshead"><div class="grow"><small>${esc(a.dayName)}${w ? ` · week ${Math.min(w.week, w.weeks)} of ${w.weeks}` : ""}</small><span class="clock num" id="sessClock">${fmtTime((Date.now()-a.start)/1000)}</span></div><span class="num" style="font-weight:700">${done}/${total} sets</span></div>
    ${w ? `<p class="hint" style="margin:-6px 4px 0">${w.intro ? "Learning week: one set fewer per exercise. Stop 3–4 reps short of failure and find your working weights." : w.week >= w.weeks ? "Last week of the block: take working sets to 0–1 reps short of failure." : `This week: stop working sets ${w.rir[0]}–${w.rir[1]} reps short of failure.`}</p>` : ""}
    ${items || `<p class="hint">No exercises yet. Add some below.</p>`}
    <button data-act="pick" data-target="session" id="addExSess">+ Add exercise</button>
    <button class="primary" data-act="finish" id="finish">Finish workout</button>

}

function targetLine(it, ex){
  const t = it.target, n = it.targetSets || t.reps.length, reps = t.reps.slice(0, n);
  const what = t.kind === "new" ? "find your weight" : ex.t === "time" ? `${reps.join(", ")}${t.w ? ` with ${t.w} ${U()}` : ""}` : t.w !== "" ? `${t.w} ${U()} × ${reps.join(", ")}` : `${reps.join(", ")} reps`;
  return `<div class="tgt ${t.kind}"><b>🎯 Today: ${esc(what)}</b>${t.why ? `<span>${esc(t.why)}</span>` : ""}</div>`;
}
function summaryView(){
  const s = summary, tg = s.items.filter(it => it.target && it.target.kind !== "new"), hit = tg.filter(hitTarget).length;
  return `<div class="summary"><span class="eyebrow" style="color:inherit;opacity:.7">Workout saved</span><h2 style="font-size:30px">${esc(s.dayName)} done 💪</h2>
    <div class="stats num"><span><b>${fmtTime((s.end-s.start)/1000)}</b>time</span><span><b>${setsOf(s)}</b>sets</span><span><b>${volumeOf(s).toLocaleString()}</b>${U()} lifted</span></div>
    ${(()=>{ const r = s.items.flatMap(it=>it.sets).filter(q=>q.rir!=null); if (!r.length) return ""; const avg = r.reduce((a,q)=>a+q.rir,0)/r.length; return `<div style="font-weight:700">Average effort: ${avg.toFixed(1)} reps in reserve${avg>3?". Try pushing a little closer to failure next time.":avg<1?". That's a hard session. Recover well.":". Right in the sweet spot."}</div>`; })()}
    ${s.prs && s.prs.length ? `<div style="font-weight:700">🏆 New PR${s.prs.length>1?"s":""}: ${s.prs.map(id=>esc(exById(id).n)).join(", ")}</div>` : ""}
    ${tg.length ? `<div style="font-weight:700">🎯 Hit your target on ${hit} of ${plural(tg.length, "exercise")}.${hit < tg.length ? " Next time's targets adjust to what you did today." : ""}</div>` : ""}

    <p class="hint">${state.days.length<3?"Most programs use 3 to 5 days.":state.days.length>5?"That's a lot of days. 3 to 5 is the sweet spot.":`${state.days.length} days. Nice.`} Changes here apply to your next workout.</p>` + settingsView();

  const I = blockInfo(), b = I.b, g = state.goals, rec = REC_WEEKS[g.exp], sch = (SCHEMES[g.goal] || SCHEMES.muscle)[b.scheme || 0];

    <div class="gfield"><span class="gl">Refresh the plan every</span><div class="chips">${[4,5,6,7,8,10,12].map(w => `<button class="chip" data-act="bWeeks" data-v="${w}" id="bw-${w}" aria-pressed="${b.weeks===w}">${w} wk${w===rec?" ★":""}</button>`).join("")}</div>

      <span class="why num">${plural(pb.sessions, "workout")} · ${Math.round((pb.adherence || 0) * 100)}% of planned${pb.best && pb.best.length ? ` · best: ${pb.best.map(([id, c]) => `${esc(exById(id).n)} ${pct(c)}`).join(", ")}` : ""}</span>
      <span class="why">${pb.days.map(d => `<b>${esc(d.name)}:</b> ${d.items.map(it => esc(exById(it.ex).n)).join(", ")}`).join("<br>")}</span></div>`).join("")}</details>` : ""}</div>`;

function goalsBody(){

  const chips = (k, map) => `<div class="chips">${Object.entries(map).map(([v, l]) => `<button class="chip" data-act="goal" data-k="${k}" data-v="${v}" id="g-${k}-${v}" aria-pressed="${g[k]===v}">${l}</button>`).join("")}</div>`;
  return `<div class="gfield"><span class="gl">Main goal</span>${chips("goal", GOALS)}</div>

    <div class="gfield"><span class="gl">Priority muscles</span><div class="chips">${LIFT_MUSCLES.map(m => `<button class="chip" data-act="prio" data-v="${m}" id="gp-${slug(m)}" aria-pressed="${g.priority.includes(m)}">${m}</button>`).join("")}</div>
      <p class="hint">Up to 3. They get a little more volume, a second day if needed, and go first in the workout, where lifts gain the most (Nunes 2021).</p></div>
    <div class="gfield"><span class="gl">Where you train</span>${chips("where", WHERES)}</div>

}
function goalsPanel(){
  const g = state.goals;
  return `<details class="panel" id="goalsPanel" ${goalsOpen ? "open" : ""}><summary style="cursor:pointer;font-weight:800">🎯 My goals${g.set ? `: ${esc(GOALS[g.goal])}${g.priority.length ? ` · ${esc(g.priority.join(", "))}` : ""}` : " (set these first)"}</summary>

function playbook(){
  return `<details class="panel"><summary style="cursor:pointer;font-weight:800">📘 Physique playbook: what the research says</summary>
    <ul class="playbook" style="margin:10px 0 0;padding-left:20px">
      <li><b>Run one plan for about 6 weeks, then refresh it.</b> No study pins down an exact number. Coaches and athletes usually build in an easier week every 4–8 weeks, about every 5–6 weeks on average (Bell et al. 2024, 2025). Six weeks gives you time to progress on every lift. Beginners can run the same plan for 8–12 weeks while the weights keep going up. The app asks you to refresh when the block ends, or sooner if most lifts stall.</li>
      <li><b>Change exercises on purpose, not at random.</b> Rotating to new angles for the same muscles (incline for flat, seated curls for lying) grows the whole muscle more evenly (Fonseca 2014). Changing exercises every session isn't better, and changing too often can slow progress (Kassiano 2022).</li>
      <li><b>Week 1 of a new block is a learning week.</b> You do one set fewer and stop 3–4 reps short of failure while you find your weights. It doubles as a deload. Easier training beats a week off: a full week off cost strength in one study (Coleman 2024).</li>
      <li><b>Put your priority muscle first.</b> Exercises done early in a workout gain the most strength (Nunes 2021 meta-analysis).</li>
      <li><b>Train muscles at long lengths.</b> Seated leg curls grew the hamstrings more than lying curls (Maeo 2021), and overhead extensions grew the triceps more than pushdowns (Maeo 2023).</li>
      <li><b>Add weight once you top out your rep range on every set,</b> then work back up. That's double progression. Upper-body jumps are about 2.5–5 lb, lower-body about 5–10 lb (NSCA). Your targets do this for you.</li>
      <li><b>Rest 60–90 s on isolation moves, 2–3 min on big compounds.</b> A 2024 meta-analysis found a small growth advantage for resting more than 60 s instead of less, and no clear extra benefit past about 90 s. Heavy squats, deadlifts and presses get longer so you can repeat your reps. New exercises you add get these rest times automatically.</li>
      <li><b>Train close to failure.</b> Most working sets should end 0–3 reps short of failure (RIR 0–3). Log it with the RIR buttons after each set.</li>
      <li><b>Aim for about 10–20 hard sets per muscle each week,</b> split over 2 or more sessions. The Progress tab tracks this for you.</li>
      <li><b>Rep ranges from about 6 to 30 all build muscle</b> when sets are taken close to failure. 6–15 is the most time-efficient.</li>
      <li><b>Progressive overload wins.</b> Add a rep or a little weight over time. The app suggests it when you top out your rep range.</li>
      <li><b>Warm-up sets don't count.</b> Tag them W so they don't count toward volume, sets or records.</li>
    </ul></details>`;
}

    ${weeks.map((w,k)=>{ const h = w.v/niceMax*(Hh-4); const x = 36 + k*bw + 5; return `<rect class="bar" x="${x}" y="${Hh-h}" width="${bw-10}" height="${Math.max(0,h)}" rx="4"><title>Week of ${fmtDate(w.a)}: ${w.v.toLocaleString()} ${U()}</title></rect><text x="${x+(bw-10)/2}" y="${Hh+18}" text-anchor="middle">${k===7?"This wk":new Date(w.a).toLocaleDateString(undefined,{month:"numeric",day:"numeric"})}</text>`; }).join("")}

}

const GENERIC = new Set(["dumbbell","barbell","machine","cable","smith","single","arm","leg","band","kettlebell","ez","bar","weighted","seated","standing","hammer","strength","the","to","and","with"]);
const words = n => n.toLowerCase().split(/[^a-z0-9]+/).filter(w => w && !GENERIC.has(w));
const loaded = ex => !["BW","BA"].includes(ex.e);
function doneBefore(exId){ return state.sessions.some(s => s.items.some(it => it.ex === exId)); }
function swapSuggestions(exId, exclude){
  const cur = exById(exId), pat = patternOf(cur), kl = klass(cur), curWords = words(cur.n);
  const scored = lib().filter(x => x.id !== exId && !exclude.includes(x.id) && x.t === cur.t && x.m === cur.m).map(x => {
    let sc = 0, why = [];
    if (patternOf(x) === pat){ sc += 4; }
    if (klass(x) === kl) sc += 2;
    const shared = words(x.n).filter(w => curWords.includes(w)).length; sc += Math.min(4, shared * 2);
    if (loaded(cur) && !loaded(x)) sc -= 3;
    if (x.e !== cur.e){ sc += 1; why.push(`uses ${EQ[x.e].toLowerCase()}`); }
    if (doneBefore(x.id)){ sc += 1.5; why.push("you've done it"); }
    return { x, sc, why };
  }).sort((a,b) => b.sc - a.sc || a.x.n.localeCompare(b.x.n));
  // variety: at most 2 with the same equipment
  const out = [], perEq = {};
  for (const c of scored){ if (out.length >= 5) break; perEq[c.x.e] = (perEq[c.x.e]||0) + 1; if (perEq[c.x.e] > 2) continue; out.push(c); }
  return out;
}
function chooseSwap(id){
  const mode = state.swapMode;
  if (mode === "ask" && state.active.dayId){ swap.chosen = id; render(); }
  else applySwap(id, mode === "always" && !!state.active.dayId);
}
function applySwap(newId, permanent){
  const a = state.active, it = a.items[swap.x], oldId = it.ex;
  const tpl = { ex:newId, sets:it.targetSets || it.sets.length, lo:it.lo, hi:it.hi, rest:it.rest, ss:it.ss };
  const fresh = buildSessionItem(tpl, null, true);
  if (it.sets.some(s => s.done)){ it.sets = it.sets.filter(s => s.done); it.ss = false; fresh.sets = fresh.sets.slice(0, Math.max(1, (it.targetSets||3) - it.sets.length)); fresh.target.reps = fresh.target.reps.slice(0, fresh.sets.length); fresh.targetSets = fresh.sets.length; a.items.splice(swap.x + 1, 0, fresh); }
  else a.items[swap.x] = fresh;

  showToast(`Swapped to ${exById(newId).n}${permanent?" and updated your program":" for today"}.`);
  swap = null; save(); render();
}

const hash = s => { let h = 2166136261; for (let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; };
const KRANK = { heavy:0, comp:1, iso:2, time:3 };
const ISO_ANGLES = new Set(["fly","lat","rear","front","legext","legcurl","abduct","gkick","over","tri","curl","hammer","calf","shrug","pullover","crunch","legraise","anti","rotate"]);
function angleOf(ex){ const p = patternOf(ex); if (ex.m === "Triceps") return /Overhead|Katana/.test(ex.n) ? "over" : p === "tri" ? "tri" : "press"; return p; }
const stable = ex => ["MA","CA","SM"].includes(ex.e) || /Chest-Supported|Seated|Preacher|Machine/.test(ex.n);
const restFor = ex => { const k = klass(ex); return state.goals.goal === "strength" && k === "heavy" ? 180 : DEFAULTS[k].rest; };
function usedIn(days){ const s = new Set(); (days || []).forEach(d => d.items.forEach(it => s.add(it.ex))); return s; }
const cap1 = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const bareName = id => exById(id).n.toLowerCase().replace(/^(single-(arm|leg)|alternating)\s+/, "");
const near = (a, b) => { const x = bareName(a), y = bareName(b); return x.includes(y) || y.includes(x); };

// Builds the next block. Every exercise changes, to a new angle for the same muscle and job in the day. Volume moves
// with how each muscle did (stalled muscles get a little more, or less when it was already high), priority muscles get
// more and go first, muscles trained once a week get a second day when they need it, and the days fit your time.
function planNext(opt){
  const g = state.goals, A = analyzeBlock(), goal = SCHEMES[g.goal] ? g.goal : "muscle";
  const schemeIdx = ((state.block.scheme || 0) + 1) % 2, sch = SCHEMES[goal][schemeIdx];
  const last = usedIn(state.days); A.ex.forEach(r => last.add(r.id));
  const older = usedIn((state.blocks[state.blocks.length-1] || {}).days);
  const avoid = new Set(g.avoid), eqs = WHERE_EQ[g.where] ? new Set(WHERE_EQ[g.where].split(" ")) : null, prio = new Set(g.priority);
  const doneSet = new Set(state.sessions.flatMap(s => s.items.map(it => it.ex)));
  const keepSplit = opt.days === state.days.length, notes = [];
  // 1. the jobs in each day: from your current days, or a new layout when the number of days changes
  const days = keepSplit
    ? state.days.map(d => ({ name:d.name, items:d.items.map((it, xi) => { const e = exById(it.ex); return { m:e.m, t:e.t, pat:angleOf(e), kl:klass(e), old:it.ex, sets:it.sets || 3, lo0:it.lo, hi0:it.hi, ss:!!it.ss, pos:xi, loaded:loaded(e) }; }) }))
    : SPLITS[opt.days].days.map(([name, spec]) => ({ name, items:spec.split(",").map((s, xi) => { const [m, pat, k] = s.split(":"); return { m, t:"reps", pat, kl:{ h:"heavy", c:"comp", i:"iso" }[k], old:null, sets:k === "h" ? 4 : 3, pos:xi, loaded:true }; }) }));
  const nD = days.length, dayLoad = d => d.items.reduce((a, s) => a + s.sets, 0);
  // 2. weekly sets for each muscle
  const cur = {}; state.days.forEach(d => d.items.forEach(it => { const e = exById(it.ex); cur[e.m] = (cur[e.m] || 0) + (it.sets || 0); }));
  const ms = new Set(prio); days.forEach(d => d.items.forEach(s => ms.add(s.m)));
  const plan = {};
  ms.forEach(m => {
    const c = cur[m] || 0, M = A.mus[m], tr = M ? M.trend : "new", why = [], lift = LIFT_MUSCLES.includes(m);
    if (!lift){ plan[m] = { m, cur:c, target:null, trend:tr, why, prio:false }; return; }
    let t = c || START_SETS[m] || 6;
    if (prio.has(m)){ t = Math.max(t + 2, MAJOR.has(m) ? 14 : 10); why.push(`priority: ${c ? `+${t - c} sets a week` : `${t} sets a week`}, first in the workout`); }
    else if (tr === "flat" || tr === "down"){
      const word = tr === "down" ? "slipped" : "stalled";
      if (c < 12){ t = c + 2; why.push(`${word} on ${c} sets a week, so +2 sets`); }
      else if (c > 18){ t = c - 2; why.push(`${word} on a lot of sets, so 2 fewer to let it recover`); }
      else why.push(`${word}: new exercises and a lighter first week give it a fresh start`);
    }
    else if (tr === "up") why.push("still climbing, so the volume stays");
    else if (tr === "steady" && c < 12){ t = c + 1; why.push("inching up, so +1 set a week"); }

    <p class="hint" style="margin-top:-8px">Every exercise is new: a different angle for the same muscle. Tap “Another option” to see the next best pick.</p>
    ${dayCards}
    <button class="primary" data-act="rvStart" id="rvStart">Start Block ${b.n + 1}</button>
    <p class="hint">Your history and records stay. The plan you're replacing is saved under Past blocks in the Program tab.</p>`;
}
function archiveBlock(end){
  const old = state.block, A = analyzeBlock(old), ranked = A.ex.filter(r => r.ch != null && LIFT_MUSCLES.includes(r.m)).sort((x, y) => y.ch - x.ch);
  state.blocks.push({ id:old.id, n:old.n, start:old.start, end, weeks:old.weeks, scheme:old.scheme || 0, goal:state.goals.goal, sessions:A.S.length, adherence:A.adherence,
    best:ranked.slice(0, 3).filter(r => r.ch > 0).map(r => [r.id, r.ch]), worst:ranked.slice(-3).filter(r => r.ch < .015).map(r => [r.id, r.ch]),
    days:state.days.map(d => ({ name:d.name, items:d.items.map(it => ({ ex:it.ex, sets:it.sets, lo:it.lo, hi:it.hi })) })) });
}
function startNextBlock(){
  const P = review.draft, old = state.block, now = Date.now();
  archiveBlock(now);
  state.days = P.days.map((d, di) => ({ id:uid(), name:d.name, items:d.items.map((s, xi) => { const c = pickFor(di, xi), x = exById(c.id); return { ex:c.id, sets:s.sets, lo:x.t === "time" ? (s.lo0 || 30) : s.lo, hi:x.t === "time" ? (s.hi0 || 60) : s.hi, rest:restFor(x), ss:!!s.ss }; }) }));
  state.block = { id:uid(), n:old.n + 1, start:now, weeks:review.weeks, auto:review.weeks === REC_WEEKS[state.goals.exp], intro:review.intro, scheme:P.schemeIdx };
  review = null; save(); render(); window.scrollTo(0,0);
  showToast(`Block ${state.block.n} is ready.${state.block.intro ? " Week 1 is your learning week." : ""}`);
}

// ---------- actions ----------
function newItem(exId){ const ex = exById(exId); return { ex:exId, ...DEFAULTS[klass(ex)] }; }
// A workout item with today's target filled in. In a learning week each exercise gets one set fewer.
function buildSessionItem(tpl, ctx, exactSets){
  ctx = ctx || sessionCtx(state.active ? state.active.dayId : null);
  const ex = exById(tpl.ex), n = ctx.intro && !exactSets && (tpl.sets || 3) > 2 ? (tpl.sets || 3) - 1 : (tpl.sets || 3);
  const t = targetFor({ ...tpl, sets:n }, ctx), last = lastPerf(tpl.ex), lw = last && last.work.length ? String(last.work[0].w || "") : "";
  const sets = Array.from({length:n}, (_,k) => ({ w: t.w !== "" ? String(t.w) : (t.kind === "new" ? "" : lw), r: t.reps[k] !== "" && t.reps[k] != null ? String(t.reps[k]) : "", done:false }));
  return { ex:tpl.ex, sets, targetSets:n, lo:tpl.lo, hi:tpl.hi, rest:tpl.rest || DEFAULTS[klass(ex)].rest, ss:!!tpl.ss, target:{ w:t.w, reps:t.reps, kind:t.kind, why:t.why } };
}
function startSession(day){
  const ctx = sessionCtx(day ? day.id : null);
  state.active = { id:uid(), dayId: day ? day.id : null, dayName: day ? day.name : "Workout", start:Date.now(), items: day ? day.items.map(it => buildSessionItem(it, ctx)) : [], lastDone:null,
    wk: day ? { week:ctx.week, weeks:ctx.weeks, intro:ctx.intro, rir:ctx.rir } : null };
  state.tab = "train"; review = null; save(); render(); window.scrollTo(0,0); keepAwake();
}
function finishSession(){
  const a = state.active;
  a.items = a.items.filter(it => it.sets.some(s => s.done)).map(it => ({ ...it, sets: it.sets.filter(s => s.done) }));
  if (!a.items.length){ state.active = null; state.timer = null; save(); showToast("No sets were completed, so nothing was saved."); render(); return; }
  // PRs against everything before this workout
  const prs = []; a.items.forEach(it => { const prev = bestE1(it.ex); const mine = Math.max(0, ...it.sets.map(s => e1rm(num(s.w), num(s.r)) || 0)); if (mine > 0 && mine > prev && prev > 0) prs.push(it.ex); });
  const wasDue = blockInfo().due;
  const sess = { id:a.id, dayId:a.dayId, dayName:a.dayName, start:a.start, end:Date.now(), items:a.items.map(it => it.target ? { ...it, target:{ w:it.target.w, reps:it.target.reps, kind:it.target.kind } } : it), prs };
  state.sessions.push(sess); state.active = null; state.timer = null;
  summary = { ...sess, blockDone: !wasDue && blockInfo().due ? state.block.n : 0 };
  save(); render(); window.scrollTo(0,0);
}

document.addEventListener("pointerdown", unlockAudio, { passive:true });
document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const act = b.dataset.act, d = b.dataset.d != null ? +b.dataset.d : null, x = b.dataset.x != null ? +b.dataset.x : null;
  switch(act){
    case "tab": state.tab = b.dataset.v; summary = null; save(); render(); window.scrollTo(0,0); break;
    case "startDay": startSession(state.days[+b.dataset.i]); break;
    case "startEmpty": startSession(null); break;
    case "done": {
      const it = state.active.items[x], s = it.sets[+b.dataset.s];
      if (s.done){ s.done = false; s.pr = false; s.rest = null; save(); render(); break; }
      const ex = exById(it.ex);
      if (ex.t === "time" ? !parseTime(s.r) : !num(s.r)){ showToast(ex.t==="time" ? "Enter the time first, like 0:45." : "Enter your reps first."); render(); break; }
      s.done = true; s.ts = Date.now();
      if (state.active.lastDone) s.rest = Math.round((s.ts - state.active.lastDone)/1000);
      state.active.lastDone = s.ts;
      const v = s.tag === "W" ? null : e1rm(num(s.w), num(s.r)), prev = bestE1(it.ex);
      const sessBest = Math.max(0, ...it.sets.filter(q=>q!==s && q.done).map(q=>e1rm(num(q.w), num(q.r))||0));
      if (v && prev > 0 && v > prev && v > sessBest){ s.pr = true; showToast(`🏆 New PR on ${ex.n}!`); }
      // prefill the next set with this set's numbers if it's empty
      const nx = it.sets[+b.dataset.s + 1]; if (nx && !nx.done){ if (!nx.w) nx.w = s.w; if (!nx.r) nx.r = s.r; }
      const moreLeft = state.active.items.some(q => q.sets.some(z => !z.done));
      const partner = it.ss ? state.active.items[x+1] : null;
      if (partner && partner.sets.some(z => !z.done)){ state.timer = null; showToast(`Superset: go straight to ${exById(partner.ex).n}`); }
      else if (moreLeft){ const prevIt = x > 0 && state.active.items[x-1].ss ? state.active.items[x-1] : null;
        startTimer(it.rest, prevIt ? `Next round: ${exById(prevIt.ex).n}` : `Next: ${nx && !nx.done ? ex.n : "next exercise"}`); }
      else state.timer = null;
      save(); render(); break;
    }
    case "tag": { const st = state.active.items[x].sets[+b.dataset.s], order = ["", "W", "D", "F"]; st.tag = order[(order.indexOf(st.tag||"")+1) % 4] || undefined; if (!st.tag) delete st.tag; if (st.tag === "W") delete st.rir; save(); render(); break; }
    case "rir": { const st = state.active.items[x].sets[+b.dataset.s], v = +b.dataset.v; st.rir = st.rir === v ? undefined : v; if (st.rir === undefined) delete st.rir; save(); render(); break; }
    case "swap": swap = { x }; render(); window.scrollTo(0,0); break;
    case "swapClose": swap = null; render(); break;
    case "swapPick": chooseSwap(b.dataset.id); break;
    case "swapBack": swap.chosen = null; render(); break;
    case "swapApply": applySwap(swap.chosen, b.dataset.v === "1"); break;
    case "swapSearch": picker = { target:"swap", q:"", m:exById(state.active.items[swap.x].ex).m, e:"All", sel:[] }; render(); break;
    case "sxSS": { const it = state.active.items[x]; it.ss = !it.ss; save(); render(); break; }
    case "piSS": { const it = state.days[d].items[x]; it.ss = !it.ss; save(); render(); break; }
    case "swapMode": state.swapMode = b.dataset.v; save(); render(); break;
    case "addSet": { const it = state.active.items[x], l = it.sets[it.sets.length-1]; it.sets.push({ w:l?l.w:"", r:l?l.r:"", done:false }); save(); render(); break; }
    case "rmSet": { const it = state.active.items[x]; if (it.sets.length > 1) it.sets.pop(); save(); render(); break; }
    case "restTap": { const it = state.active.items[x]; startTimer(it.rest, exById(it.ex).n); save(); render(); break; }
    case "sxUp": { const a = state.active.items; if (x > 0){ [a[x-1], a[x]] = [a[x], a[x-1]]; save(); render(); } break; }
    case "sxRm": confirmThen("sxrm"+x, ()=>{ state.active.items.splice(x,1); save(); render(); }); break;
    case "finish": finishSession(); break;
    case "discard": confirmThen("discard", ()=>{ state.active = null; state.timer = null; save(); render(); }); break;
    case "closeSummary": summary = null; render(); break;
    case "tmrAdd": if (state.timer){ state.timer.end += (+b.dataset.v)*1000; state.timer.total = Math.max(5, state.timer.total + (+b.dataset.v)); save(); render(); } break;
    case "tmrClose": state.timer = null; save(); render(); break;
    // program
    case "tpl": {
      const doIt = () => { const t = TEMPLATES[b.dataset.v], old = state.block, had = blockSessions(old).length > 0;
        if (had && state.days.length) archiveBlock(Date.now());
        state.days = t.days.map(dd => ({ id:uid(), name:dd.name, items:dd.items.map(i=>({...i, sets:i.sets})) }));
        state.block = { id:uid(), n:old.n + (had ? 1 : 0), start:Date.now(), weeks:REC_WEEKS[state.goals.exp], auto:true, intro:false, scheme:0 };
        save(); render(); showToast(`${t.name} loaded. Tweak anything you like.`); };
      if (state.days.length) confirmThen("tpl"+b.dataset.v, doIt); else doIt(); break;
    }
    // goals & blocks
    case "goal": { const k = b.dataset.k, v = k === "minutes" ? +b.dataset.v : b.dataset.v; state.goals[k] = v; state.goals.set = true;
      if (k === "exp" && state.block.auto) state.block.weeks = REC_WEEKS[v];
      if (review){ review.draft = null; review.pick = {}; if (k === "exp") review.weeks = REC_WEEKS[v]; } save(); render(); break; }
    case "prio": { const p = state.goals.priority, m = b.dataset.v, k = p.indexOf(m);
      if (k >= 0) p.splice(k, 1); else if (p.length >= 3){ showToast("Pick up to 3. Prioritizing everything means prioritizing nothing."); break; } else p.push(m);
      state.goals.set = true; if (review){ review.draft = null; review.pick = {}; } save(); render(); break; }
    case "gAvoidRm": { const a2 = state.goals.avoid, k = a2.indexOf(b.dataset.id); if (k >= 0) a2.splice(k, 1); if (review){ review.draft = null; review.pick = {}; } save(); render(); break; }
    case "bWeeks": state.block.weeks = +b.dataset.v; state.block.auto = +b.dataset.v === REC_WEEKS[state.goals.exp]; save(); render(); break;
    case "bShift": state.block.start = Math.min(startOfDay(Date.now()), state.block.start + (+b.dataset.v) * dayMs); save(); render(); break;
    case "bMore": state.block.weeks = Math.min(16, state.block.weeks + 1); state.block.auto = false; state.block.ext = (state.block.ext || 0) + 1; save(); render(); showToast("One more week. You'll be asked again after it."); break;
    case "openReview": openReview(); render(); window.scrollTo(0,0); break;
    case "rvClose": review = null; render(); window.scrollTo(0,0); break;
    case "rvGoals": review.goals = !review.goals; render(); break;
    case "rvDays": review.days = +b.dataset.v; review.draft = null; review.pick = {}; render(); break;
    case "rvWeeks": review.weeks = +b.dataset.v; render(); break;
    case "rvIntro": review.intro = !review.intro; render(); break;
    case "rvAlt": { const s = review.draft.days[d].items[x], k = d + "-" + x; let p = review.pick[k] === "keep" || review.pick[k] == null ? 0 : review.pick[k];
      const used = new Set(review.draft.days[d].items.map((_, j) => j === x ? null : pickFor(d, j).id));
      for (let i = 0; i < s.cands.length; i++){ p = (p + 1) % s.cands.length; if (!used.has(s.cands[p].id)) break; }
      review.pick[k] = p; render(); break; }
    case "rvKeep": review.pick[d + "-" + x] = "keep"; render(); break;
    case "rvStart": startNextBlock(); break;
    case "addDay": state.days.push({ id:uid(), name:`Day ${state.days.length+1}`, items:[] }); save(); render(); break;
    case "dayUp": if (d > 0){ [state.days[d-1], state.days[d]] = [state.days[d], state.days[d-1]]; save(); render(); } break;
    case "dayRm": confirmThen("dayrm"+d, ()=>{ state.days.splice(d,1); save(); render(); }); break;
    case "piUp": { const a = state.days[d].items; if (x > 0){ [a[x-1], a[x]] = [a[x], a[x-1]]; save(); render(); } break; }
    case "piDown": { const a = state.days[d].items; if (x < a.length-1){ [a[x+1], a[x]] = [a[x], a[x+1]]; save(); render(); } break; }
    case "piRm": state.days[d].items.splice(x,1); save(); render(); break;
    case "piSets": { const it = state.days[d].items[x]; it.sets = Math.max(1, Math.min(10, it.sets + (+b.dataset.v))); save(); render(); break; }
    case "piRest": { const it = state.days[d].items[x]; it.rest = Math.max(0, Math.min(600, it.rest + (+b.dataset.v))); save(); render(); break; }
    case "pick": picker = { target:b.dataset.target, d, q:"", m:"All", e:"All", sel:[] }; render(); break;
    case "pickClose": picker = null; render(); break;
    case "pm": picker.m = b.dataset.v; render(); break;
    case "pToggle": { const id = b.dataset.id, k = picker.sel.indexOf(id); if (picker.target === "swap"){ picker.sel = k >= 0 ? [] : [id]; render(); break; } if (k >= 0) picker.sel.splice(k,1); else picker.sel.push(id);
      const l = document.getElementById("plist"); render(); break; }
    case "cxAdd": {
      const n = document.getElementById("cxName").value.trim();
      if (!n){ picker.err = "Give it a name."; render(); break; }
      const id = "c-" + slug(n) + "-" + uid().slice(-4);
      state.custom.push({ id, n, m:document.getElementById("cxM").value, e:document.getElementById("cxE").value, t:document.getElementById("cxT").value });
      picker.sel.push(id); picker.err = ""; picker.q = n; save(); render(); break;
    }
    case "pickDone": {
      if (picker.target === "swap"){ const id = picker.sel[picker.sel.length-1]; picker = null; chooseSwap(id); break; }
      if (picker.target === "avoid"){ picker.sel.forEach(id => { if (!state.goals.avoid.includes(id)) state.goals.avoid.push(id); }); state.goals.set = true; if (review){ review.draft = null; review.pick = {}; }
        showToast(`The planner won't suggest ${picker.sel.length === 1 ? esc(exById(picker.sel[0]).n) : plural(picker.sel.length, "exercise")}.`); picker = null; save(); render(); break; }
      if (picker.target === "day") picker.sel.forEach(id => state.days[picker.d].items.push(newItem(id)));
      else picker.sel.forEach(id => state.active.items.push(buildSessionItem(newItem(id))));
      showToast(`Added ${plural(picker.sel.length,"exercise")}.`); picker = null; save(); render(); break;
    }
    // settings
    case "units": state.units = b.dataset.v; save(); render(); break;
    case "copyBackup": {
      const txt = JSON.stringify({ app:"iron-log", v:1, savedAt:new Date().toISOString(), data:{ ...state, timer:null } });
      try{ navigator.clipboard.writeText(txt).then(()=>{ backupBox = null; showToast("Backup copied. Paste it into a note or email to yourself."); render(); }).catch(()=>{ backupBox = txt; render(); }); }
      catch(err){ backupBox = txt; render(); }
      break;
    }
    case "downloadBackup": {
      const txt = JSON.stringify({ app:"iron-log", v:1, savedAt:new Date().toISOString(), data:{ ...state, timer:null } });
      try{ const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([txt], {type:"application/json"})); a.download = `iron-log-backup-${new Date().toISOString().slice(0,10)}.json`; document.body.appendChild(a); a.click(); a.remove(); showToast("Backup file saved."); }
      catch(err){ showToast("Your browser blocked the download. Use Copy backup instead."); }
      render(); break;
    }
    case "restore": confirmThen("restore", ()=>{
      try{ const obj = JSON.parse(restoreText.trim()); const data = obj.data || obj;
        if (!Array.isArray(data.days) || !Array.isArray(data.sessions)) throw new Error("bad");
        state = { ...fresh(), ...data, timer:null, tab:"program" }; review = null; restoreText = ""; restoreOpen = false; migrate(); save(); showToast(`Restored ${plural(state.sessions.length,"workout")}.`); render();
      }catch(err){ showToast("That doesn't look like an Iron Log backup."); render(); }
    }); break;
    case "wipe": confirmThen("wipe", ()=>{ state = fresh(); state.tab = "program"; review = null; goalsOpen = null; migrate(); save(); render(); }); break;
    case "delSess": confirmThen("dels"+b.dataset.i, ()=>{ state.sessions.splice(+b.dataset.i,1); save(); render(); }); break;
  }
});
document.addEventListener("input", e => {
  const t = e.target;
  if (t.dataset.f && state.active){ const s = state.active.items[+t.dataset.x].sets[+t.dataset.s]; s[t.dataset.f] = t.value.replace(/[^\d.,:]/g,""); if (s[t.dataset.f] !== t.value) t.value = s[t.dataset.f]; save(); }
  if (t.dataset.note != null){ const v = t.value.trim(); if (v) state.notes[t.dataset.note] = t.value; else delete state.notes[t.dataset.note]; save(); }
  if (t.dataset.dname != null){ state.days[+t.dataset.dname].name = t.value; save(); }
  if (t.id === "restoreBox") restoreText = t.value;
  if (t.dataset.pf){ const it = state.days[+t.dataset.d].items[+t.dataset.x], v = parseInt(t.value.replace(/\D/g,""),10); if (!isNaN(v)){ it[t.dataset.pf] = v; save(); } }
  if (t.id === "pq" && picker){ picker.q = t.value; const l = lib(); document.getElementById("plist").firstElementChild; rerenderList(); }
});
function rerenderList(){
  const p = picker, q = p.q.trim().toLowerCase(); let list = lib();
  if (p.m !== "All") list = list.filter(x => x.m === p.m);
  if (p.e !== "All") list = list.filter(x => x.e === p.e);
  if (q) list = list.filter(x => (x.n + " " + x.m + " " + (EQ[x.e]||"")).toLowerCase().includes(q));
  const box = document.getElementById("plist"), det = box.querySelector("details");
  box.innerHTML = pickerList(list); if (det) box.appendChild(det);
}
document.addEventListener("change", e => {
  if (e.target.id === "pe" && picker){ picker.e = e.target.value; render(); }
  if (e.target.id === "progressEx"){ progressEx = e.target.value; render(); }
});
document.addEventListener("keydown", e => {
  if (e.key === "Enter" && e.target.dataset && e.target.dataset.f){ e.preventDefault(); const f = e.target.dataset.f, x = e.target.dataset.x, s = e.target.dataset.s;
    const next = f === "w" ? document.getElementById(`r-${x}-${s}`) : null; if (next) next.focus(); else e.target.blur(); }
});

// remember which collapsible panels are open, since every tap re-renders the page
document.addEventListener("toggle", e => { const id = e.target.id; if (id === "goalsPanel") goalsOpen = e.target.open; if (id === "pastBlocks") pastOpen = e.target.open; if (id === "restorePanel") restoreOpen = e.target.open; }, true);

if (state.timer && Date.now() - state.timer.end > 60000) state.timer = null;
migrate(); save();
render();
keepAwake();
</script>
